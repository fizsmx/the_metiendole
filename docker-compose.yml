name: metiendole

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: metiendole_web
    env_file: .env
    environment:
      NODE_ENV: development
      # Los cambios en archivos de Windows no llegan por inotify al contenedor: usar polling
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      # node_modules y .next propios del contenedor (binarios Linux, no los de Windows)
      - metiendole_node_modules:/app/node_modules
      - metiendole_next:/app/.next
    restart: unless-stopped

  # ---------- Producción (para el stream): docker compose --profile prod up -d --build ----------
  prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: metiendole_prod
    environment:
      # Solo lo necesario (sin NEXTAUTH_URL=localhost: con trustHost, Auth.js usa la dirección del túnel)
      AUTH_SECRET: ${AUTH_SECRET}
      # Dirección pública (la del túnel). Se pasa al levantar: AUTH_URL=https://xxxx.trycloudflare.com docker compose --profile prod up -d prod
      AUTH_URL: ${AUTH_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      NEXT_PUBLIC_YOUTUBE_CHANNEL_NAME: ${NEXT_PUBLIC_YOUTUBE_CHANNEL_NAME}
      NEXT_PUBLIC_COMMUNITY_NAME: ${NEXT_PUBLIC_COMMUNITY_NAME}
      # Base propia de producción (votos reales), separada de la de desarrollo
      DATABASE_URL: file:/app/db/prod.db
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - ./data:/app/data:ro
      - metiendole_prod_db:/app/db
    restart: unless-stopped

  # Túnel público gratuito de Cloudflare hacia el servicio prod (la dirección sale en: docker compose logs tunnel)
  tunnel:
    profiles: ["prod"]
    image: cloudflare/cloudflared:2025.2.0
    container_name: metiendole_tunnel
    command: tunnel --no-autoupdate --url http://prod:3000
    depends_on:
      - prod
    restart: unless-stopped

volumes:
  metiendole_node_modules:
  metiendole_next:
  metiendole_prod_db:
